[project]
name = "spherex-sky-flipbook"
version = "0.1.0"
description = "Blink NASA SPHEREx infrared images of any patch of sky to spot moving and changing objects."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "astropy>=7.0",
    "fastapi>=0.115",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["uvicorn[standard]>=0.30"]
